version: '3.8'

services:
  # Container do Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: via_audit_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_NAME:-via_audit_db}
      MYSQL_USER: ${DB_USER:-audit_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-auditpass2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./via-audit-api/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - via_audit_network

  # Container da API Node.js REST
  api:
    build:
      context: ./via-audit-api
      dockerfile: Dockerfile
    container_name: via_audit_api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_USER: ${DB_USER:-audit_user}
      DB_PASSWORD: ${DB_PASSWORD:-auditpass2026}
      DB_NAME: ${DB_NAME:-via_audit_db}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET:-via-audit-production-super-secret-key-2026}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - via_audit_network

networks:
  via_audit_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
